<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daniel Drejer Rasmussen - Solution Architect</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    .container {
      display: flex;
      max-width: 1100px;
      margin: auto;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      align-items: stretch;
    }
    .photo {
      width: 40%;
      background: #fff;
      padding: 0;
      display: block;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .info {
      width: 60%;
      background: #0f3434;
      color: white;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .name {
      font-size: 36px;
      font-weight: bold;
      line-height: 1.2;
      margin-bottom: 5px;
    }
    .title {
      font-size: 18px;
      margin-bottom: 0px;
    }
    .contact a {
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    .contact a i {
      margin-right: 10px;
      color: #ff6b6b;
    }
    .linkedin a {
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      text-decoration: none;
    }
    .linkedin a i {
      margin-right: 10px;
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="photo">
      <img src="portrait.png" alt="Daniel Drejer Rasmussen" />
    </div>

    <div class="info">
      <div class="name">DANIEL DREJER<br>RASMUSSEN</div>
      <div class="title">SOLUTION ARCHITECT</div>
		<hr style="border: 0; border-top: 2px solid #fff; margin: 20px 0;">
      <div class="contact">
        <a href="tel:+4531443503"><i class="fa-solid fa-phone"></i> +45 3144 3503</a>
        <a href="mailto:daniel@drejr.dk"><i class="fa-solid fa-envelope"></i> daniel@drejr.dk</a>
      </div>

      <div class="linkedin">
        <a href="https://www.linkedin.com/in/danieldrejerrasmussen" target="_blank">
          <i class="fa-brands fa-linkedin"></i> LinkedIn
        </a>
      </div>
    </div>
  </div>
</body>
</html>
